services:
  petr4-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: petr4-lstm-api:latest
    container_name: petr4-lstm-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
